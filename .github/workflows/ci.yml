name: CI

permissions:
  contents: read

# TRIGGERS: `push` is scoped to `main`. Without a branch filter it also matches
# pushes to pull-request branches, which already match `pull_request`, so every
# job ran twice per commit, on two separate workflow runs. Naming `branches:`
# also stops tag pushes from matching. `pull_request` checks out the branch
# already merged into its base, so merge coverage is not what is being dropped
# here — the one thing lost is CI on a branch with no pull request open, and
# `workflow_dispatch` replaces it (`gh workflow run ci.yml --ref <branch>`).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ungated and standalone, matching `aicers/roxyd` and `aicers/agentcoop`. Kept
  # out of `check` so a clippy failure cannot hide the Markdown result, and so
  # the lint survives if the expensive jobs are ever put behind a path filter.
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      # The shared instruction-block drift check, which used to be a job of
      # its own calling `check-drift.yml` as a reusable workflow. Actions is
      # free on a public repository, so nothing was being billed for it;
      # what it cost was a job -- a scheduling slot and a row in every run
      # -- for nine seconds of byte comparison. As a step it runs inside a
      # job that already exists, and the fleet's other consumers carry it
      # the same way.
      #
      # `markdown` rather than `check`. This workflow has no change filter,
      # so there is no `docs_only` gate for the step to inherit -- the
      # reason that forces this placement in the consumers that do have one,
      # where AGENTS.md counts as inert documentation and a gated step would
      # be skipped on exactly the change that causes drift. Here it is
      # simply the job that already concerns itself with this class of file,
      # it is where every sibling consumer keeps the step, and it is the job
      # that would have to stay ungated if a path filter is ever added.
      #
      # `@main`, as the workflow reference was. The scripts are mechanism
      # and come from wherever this reference points; the blocks are content
      # and come from the pin in `.agent-instructions.toml`. Pinning the
      # action to a release would freeze the check's implementation at
      # whatever shipped beside those blocks.
      #
      # No `with:` block. The release to compare against and the blocks to
      # compare are both read from `.agent-instructions.toml`, so they have
      # one source rather than two that can disagree, and the apply job that
      # rewrites them never has to touch `.github/workflows/` -- which the
      # default GITHUB_TOKEN may not push to. The pin is a release tag
      # rather than a branch, so an edit upstream reaches this repository
      # through the pull request that moves it instead of turning every
      # unrelated pull request red.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip this step whenever a step above it failed. The checks are
      # independent -- a drifted block is drift whether or not some other
      # file also breaks a lint rule -- and as separate jobs they both
      # always reported. A short-circuit here would hide drift on precisely
      # the changes that touch the most Markdown, and would report it only
      # after a later push had fixed something unrelated.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop,
      # not keep checking. The `checkout` clause is what keeps a failed
      # checkout from being reported as drift -- the action fails outright
      # when it cannot read `.agent-instructions.toml`, and in an empty
      # workspace that message names the pin for a problem that is not the
      # pin's.
      - uses: aicers/agent-instructions/check-drift@main
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate

      - name: Check Rust Lints (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run Security Audit
        run: cargo audit

  test:
    name: Test
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

  ac0-pipeline:
    name: AC-0 Pipeline
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Generate AC-0 bundle
        run: cargo run --release -- generate -s scenarios/ac-0.scenario.yaml -o ac0-bundle

      - name: Validate AC-0 bundle
        run: cargo run --release -- validate -b ac0-bundle

  ac0-compressed-pipeline:
    name: AC-0 Compressed Pipeline
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Generate AC-0 compressed bundle
        run: cargo run --release -- generate -s scenarios/ac-0-compressed.scenario.yaml -o ac0c-bundle

      - name: Validate AC-0 compressed bundle
        run: cargo run --release -- validate -b ac0c-bundle

      - name: Assert meta.json invariants
        run: python3 .github/scripts/check_ac0_compressed_meta.py ac0c-bundle/meta.json

      - name: Assert ground_truth manifest invariants
        run: python3 .github/scripts/check_ac0_compressed_gt.py ac0c-bundle/ground_truth/manifest.jsonl

      - name: Assert pcap structural invariants
        run: python3 .github/scripts/check_ac0_compressed_pcap.py ac0c-bundle/net/lan.pcap

  docker-e2e:
    name: Docker E2E
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Docker E2E Tests
        run: cargo test -- --ignored
